# ekin_fenologiya sozlamalari

manba: aws                      # aws | pc

manbalar:
  aws:
    stac: https://earth-search.aws.element84.com/v1
    collection: sentinel-2-c1-l2a
    kanallar: {qizil: red, nir: nir, swir16: swir16, scl: scl}
    imzo: false
  pc:
    stac: https://planetarycomputer.microsoft.com/api/stac/v1
    collection: sentinel-2-l2a
    kanallar: {qizil: B04, nir: B08, swir16: B11, scl: SCL}
    imzo: true                  # Planetary Computer SAS token

davr:                           # asosiy oraliq (qaror 0003)
  boshi: "2026-02-01"
  oxiri: "2026-10-31"

bulut_max_foiz: 70              # sahna darajasida; piksel darajasida SCL niqobi alohida
scl_toza: [4, 5, 6, 7]          # SCL: 4 vegetatsiya, 5 ochiq tuproq, 6 suv, 7 aniqlanmagan (bulut/soya/qor emas)
# kontur chetidan ichkariga bufer — MAYDONGA QARAB (qaror 0004). Kichik konturlar o'zgarishsiz qoladi.
ichki_bufer:
  pogonalar:                    # maydon (ga) >= min_ga bo'lsa shu bufer (m); eng kattasi tanlanadi
    - {min_ga: 0.0, bufer_m: 0}
    - {min_ga: 0.5, bufer_m: 5}
    - {min_ga: 2.0, bufer_m: 10}
  min_qolgan_ulush: 0.5         # bufer kontur maydonining kamida 50% ini qoldirsin, aks holda kichikroq bufer
  min_qolgan_m2: 300            # va kamida ~3 ta 10 m piksel
min_toza_piksel: 3              # sanadagi minimal toza piksel soni

indekslar: [ndvi, evi2, ndmi]

# 04 fenologiya (qaror 0010)
fenologiya:
  min_toza_ulush: 0.5           # dalaning kamida 50% i toza bo'lgan kunlar olinadi
  pastga_sakrash: 0.15          # ikki qo'shnisidan shuncha past yakka nuqta = bulut qoldig'i, olib tashlanadi
  silliqlash_kun: 15            # kunlik interpolyatsiyadan keyin surilma o'rtacha oynasi
  faol_min_ndvi: 0.30           # faol deyish uchun mutlaq minimal NDVI
  faol_nisbiy: 0.35             # va asos + 35% * (cho'qqi - asos) dan yuqori
  min_amplituda: 0.15           # cho'qqi - asos bundan kichik bo'lsa: dala yil bo'yi faol emas
  min_sikl_kun: 20              # bundan qisqa faol oraliq hisobga olinmaydi
  chegara_ulush: 0.20           # sikl boshi/oxiri: o'z amplitudasining 20% i (eng past nuqtadan cho'qqigacha)
  chegarada_faol_ndvi: 0.40     # davr boshida/oxirida NDVI shundan yuqori bo'lsa faollik davr chegarasidan
  birlashtirish_kun: 15         # sikllar orasidagi bundan qisqa pasayish (beda o'rimi) birlashtiriladi
  uzun_sikl_kun: 150            # bundan uzun bitta sikl = butun mavsum (paxta, bog')
  mavsum_bolinishi: "06-20"     # yagona sikl cho'qqisi shu sanagacha -> Birlamchi, keyin -> Ikkilamchi
  oldingi_sugorish_kun: 0       # suv_boshi faollik boshidan necha kun oldin (ekishdan oldingi sug'orish)
  qatiy_oyna:                   # yorliq mosligini tekshirish uchun hozirgi qat'iy oylar
    Birlamchi ekin: [3, 5]
    Ikkilamchi ekin: [6, 10]
    Mavsumiy ekin: [3, 10]

ishchi: 12                      # parallel jarayonlar

kirish_konturlar: ../bir_ikki_lamchi/natija/ekin_yerlar_toliq.gpkg
